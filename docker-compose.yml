services:
  haproxy:
    image: haproxy:2.9
    container_name: haproxy
    volumes:
      - ./config/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - ./certs/live:/usr/local/etc/haproxy/certs:ro
    ports:
      - "${HAPROXY_HTTP_PORT:-80}:80"
      - "${HAPROXY_HTTPS_PORT:-443}:443"
    depends_on:
      - varnish
      - grafana
      - keycloak
      - prometheus
    networks:
      - golum
    restart: unless-stopped

  varnish:
    image: varnish:7.4
    container_name: varnish
    depends_on:
      moodle1:
        condition: service_started
      moodle2:
        condition: service_started
    volumes:
      - ./config/varnish/default.vcl:/etc/varnish/default.vcl:ro
    command:
      - varnishd
      - -F
      - -f
      - /etc/varnish/default.vcl
      - -s
      - malloc,256m
      - -a
      - :6081
      - -T
      - :6082
    networks:
      - golum
    restart: unless-stopped

  moodle-code:
    image: alpine:3
    container_name: moodle-code
    environment:
      - MOODLE_GIT_BRANCH=${MOODLE_GIT_BRANCH:-MOODLE_501_STABLE}
    command:
      - /bin/sh
      - -c
      - |
        set -e
        apk add --no-cache git
        if [ ! -f /var/www/html/index.php ]; then
          git clone --depth 1 -b "${MOODLE_GIT_BRANCH}" https://github.com/moodle/moodle.git /var/www/html
          chown -R 33:33 /var/www/html
        else
          echo "Moodle code already present; skipping clone."
        fi
    volumes:
      - moodle_code:/var/www/html
    networks:
      - golum
    restart: "no"

  moodle-install:
    image: ${MOODLE_IMAGE:-moodlehq/moodle-php-apache:8.3-bookworm}
    container_name: moodle-install
    env_file: .env
    working_dir: /var/www/html
    command: /usr/local/bin/install-and-configure-moodle.sh
    depends_on:
      postgres:
        condition: service_started
      moodle-code:
        condition: service_completed_successfully
    volumes:
      - moodle_code:/var/www/html
      - moodledata:/bitnami/moodledata
      - ./docker/moodle/install-and-configure.sh:/usr/local/bin/install-and-configure-moodle.sh:ro
    networks:
      - golum
    restart: "no"

  postgres:
    image: postgres:15
    container_name: postgres
    env_file: .env
    environment:
      - POSTGRES_USER=${POSTGRES_SUPERUSER}
      - POSTGRES_PASSWORD=${POSTGRES_SUPERUSER_PASSWORD}
      - TZ=${TZ}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    networks:
      - golum
    restart: unless-stopped

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:latest
    container_name: postgres-exporter
    env_file: .env
    environment:
      - DATA_SOURCE_NAME=postgresql://${POSTGRES_MONITOR_USER}:${POSTGRES_MONITOR_PASSWORD}@postgres:5432/postgres?sslmode=disable
    depends_on:
      - postgres
    networks:
      - golum
    restart: unless-stopped

  prom-node-exporter:
    image: prom/node-exporter:latest
    container_name: prom-node-exporter
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro,rslave
    networks:
      - golum
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    networks:
      - golum
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.2
    container_name: grafana
    env_file: .env
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_SERVER_ROOT_URL=https://grafana.golum.io
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - golum
    restart: unless-stopped

  moodle1:
    image: ${MOODLE_IMAGE:-moodlehq/moodle-php-apache:8.3-bookworm}
    container_name: moodle1
    depends_on:
      moodle-code:
        condition: service_completed_successfully
      moodle-install:
        condition: service_completed_successfully
      postgres:
        condition: service_started
    env_file: .env
    environment:
      - MOODLE_DATABASE_TYPE=pgsql
      - MOODLE_DATABASE_HOST=postgres
      - MOODLE_DATABASE_PORT_NUMBER=5432
      - MOODLE_DATABASE_NAME=${MOODLE_DB_NAME}
      - MOODLE_DATABASE_USER=${MOODLE_DB_USER}
      - MOODLE_DATABASE_PASSWORD=${MOODLE_DB_PASSWORD}
      - MOODLE_HOST=learn.golum.io
      - MOODLE_USERNAME=${MOODLE_ADMIN_USER}
      - MOODLE_PASSWORD=${MOODLE_ADMIN_PASSWORD}
      - MOODLE_EMAIL=${MOODLE_ADMIN_EMAIL}
      - MOODLE_SITE_NAME=${MOODLE_SITE_NAME}
      - MOODLE_REVERSEPROXY=true
      - MOODLE_SSLPROXY=true
      - PHP_MEMORY_LIMIT=512M
      - PHP_UPLOAD_MAX_FILESIZE=100M
      - PHP_POST_MAX_SIZE=100M
      - TZ=${TZ}
    volumes:
      - moodle_code:/var/www/html
      - moodledata:/bitnami/moodledata
    networks:
      - golum
    restart: unless-stopped

  moodle2:
    image: ${MOODLE_IMAGE:-moodlehq/moodle-php-apache:8.3-bookworm}
    container_name: moodle2
    depends_on:
      moodle-code:
        condition: service_completed_successfully
      moodle-install:
        condition: service_completed_successfully
      postgres:
        condition: service_started
    env_file: .env
    environment:
      - MOODLE_DATABASE_TYPE=pgsql
      - MOODLE_DATABASE_HOST=postgres
      - MOODLE_DATABASE_PORT_NUMBER=5432
      - MOODLE_DATABASE_NAME=${MOODLE_DB_NAME}
      - MOODLE_DATABASE_USER=${MOODLE_DB_USER}
      - MOODLE_DATABASE_PASSWORD=${MOODLE_DB_PASSWORD}
      - MOODLE_HOST=learn.golum.io
      - MOODLE_USERNAME=${MOODLE_ADMIN_USER}
      - MOODLE_PASSWORD=${MOODLE_ADMIN_PASSWORD}
      - MOODLE_EMAIL=${MOODLE_ADMIN_EMAIL}
      - MOODLE_SITE_NAME=${MOODLE_SITE_NAME}
      - MOODLE_REVERSEPROXY=true
      - MOODLE_SSLPROXY=true
      - PHP_MEMORY_LIMIT=512M
      - PHP_UPLOAD_MAX_FILESIZE=100M
      - PHP_POST_MAX_SIZE=100M
      - TZ=${TZ}
    volumes:
      - moodle_code:/var/www/html
      - moodledata:/bitnami/moodledata
    networks:
      - golum
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: keycloak
    env_file: .env
    environment:
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN_USER}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      - KC_DB=postgres
      - KC_DB_URL_HOST=postgres
      - KC_DB_URL_PORT=5432
      - KC_DB_URL_DATABASE=${KEYCLOAK_DB_NAME}
      - KC_DB_USERNAME=${KEYCLOAK_DB_USER}
      - KC_DB_PASSWORD=${KEYCLOAK_DB_PASSWORD}
      - KC_PROXY=edge
      - KC_HOSTNAME_URL=https://sso.golum.io
      - KC_HOSTNAME_ADMIN_URL=https://sso.golum.io/admin
      - KC_PROXY_HEADERS=xforwarded
      - TZ=${TZ}
    command:
      - start-dev
      - --hostname-strict=false
      - --http-enabled=true
    volumes:
      - keycloak_data:/opt/keycloak/data
    depends_on:
      - postgres
    networks:
      - golum
    restart: unless-stopped

volumes:
  postgres_data:
  moodledata:
  moodle_code:
  grafana_data:
  prometheus_data:
  keycloak_data:

networks:
  golum:
    driver: bridge
